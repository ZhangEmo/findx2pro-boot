name: Build Find X2 Pro Droidspaces + KernelSU-Next kernel

# Target: OPPO Find X2 Pro (PDEM30), ColorOS 13.1, stock kernel 4.19.157-perf+
# Source: jacid233/android_kernel_oplus_sm8250 @ oss-t (4.19.157, ColorOS 13)
# Workflow: checkout assets -> clone kernel -> apply Droidspaces patches ->
#           integrate KernelSU-Next legacy (syscall-table hook, no kprobes needed)
#           -> merge config fragment -> build -> pack AnyKernel3 -> upload artifact

on:
  workflow_dispatch:

env:
  KERNEL_REPO: jacid233/android_kernel_oplus_sm8250
  KERNEL_BRANCH: oss-t
  KSU_REPO: KernelSU-Next/KernelSU-Next
  KSU_BRANCH: legacy
  DEFCONFIG: stock_defconfig
  JOBS: 8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out build assets
        uses: actions/checkout@v4
        with:
          path: build-assets

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The kernel Makefile invokes "python2" via scripts/gcc-wrapper.py.
          # Ubuntu 22.04+ dropped python2; create a compatibility shim.
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev \
            bc zip curl git ccache libncurses-dev python3
          sudo tee /usr/local/bin/python2 >/dev/null <<'EOF'
          #!/bin/sh
          exec python3 "$@"
          EOF
          sudo chmod +x /usr/local/bin/python2

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${KERNEL_BRANCH} \
            https://github.com/${KERNEL_REPO}.git kernel
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' Makefile | head -3
          # stock_defconfig lives at arch/arm64/configs/, NOT in vendor/.
          test -f arch/arm64/configs/${DEFCONFIG} || \
            { echo "Missing arch/arm64/configs/${DEFCONFIG}"; \
              ls arch/arm64/configs/ | head -40; exit 1; }

      - name: Apply Droidspaces non-GKI patches
        run: |
          cd kernel
          for p in "$GITHUB_WORKSPACE/build-assets/patches/droidspaces/"*.patch; do
            echo "Applying $p"
            patch -p1 --forward < "$p"
          done

      - name: Integrate KernelSU-Next legacy (syscall-table hook)
        run: |
          cd kernel
          # Upstream setup.sh for the legacy branch. Fetch it from `legacy`,
          # NOT `next` (the `next` branch is for GKI 5.10+ kernels).
          curl -LSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh" | bash -s legacy
          grep -q '^obj-\$(CONFIG_KSU)' drivers/Makefile
          grep -q 'CONFIG_KSU=y' "$GITHUB_WORKSPACE/build-assets/configs/droidspaces.config"

      - name: Download toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          # clang-r383902b1 (the toolchain used for ColorOS 13 sm8250 kernels).
          # Use a GitHub mirror because googlesource `+archive/refs/heads/android13-release`
          # no longer exists. Mirror: github.com/qssn70/clang-r383902b1
          git clone --depth=1 https://github.com/qssn70/clang-r383902b1.git clang
          test -x clang/bin/clang || { echo "clang missing in mirror"; exit 1; }
          # GCC 4.9 for 32-bit compat + arm64 assembler/helpers
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Build kernel
        run: |
          set -e
          cd kernel
          TC=$GITHUB_WORKSPACE/toolchain
          export ARCH=arm64
          export PATH="$TC/clang/bin:$PATH"
          CROSS_COMPILE="$TC/gcc64/bin/aarch64-linux-android-"
          CROSS_COMPILE_ARM32="$TC/gcc32/bin/arm-linux-androideabi-"
          CLANG_TRIPLE="aarch64-linux-gnu-"

          mkdir -p out
          make -j${JOBS} O=out \
            ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            KCFLAGS="-Wno-error" \
            $DEFCONFIG

          # Append Droidspaces + KernelSU config fragment and resolve dependencies
          cat "$GITHUB_WORKSPACE/build-assets/configs/droidspaces.config" >> out/.config
          make -j${JOBS} O=out \
            ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            KCFLAGS="-Wno-error" \
            olddefconfig

          # Verify the options we care about actually survived olddefconfig
          for opt in CONFIG_KSU=y CONFIG_KSU_SYSCALL_TABLE_HOOK=y \
                     '# CONFIG_KSU_MANUAL_HOOK is not set' \
                     CONFIG_NAMESPACES=y CONFIG_PID_NS=y CONFIG_IPC_NS=y \
                     CONFIG_SYSVIPC=y CONFIG_POSIX_MQUEUE=y CONFIG_NET_NS=y \
                     CONFIG_VETH=y CONFIG_BRIDGE=y CONFIG_DEVTMPFS=y \
                     CONFIG_OVERLAY_FS=y CONFIG_CGROUPS=y CONFIG_MEMCG=y \
                     CONFIG_CFS_BANDWIDTH=y CONFIG_CGROUP_PIDS=y \
                     '# CONFIG_ANDROID_PARANOID_NETWORK is not set'; do
            grep -q "$opt" out/.config || { echo "MISSING CONFIG: $opt"; echo '--- .config tail ---'; tail -80 out/.config; exit 1; }
          done

          make -j${JOBS} O=out \
            ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            KCFLAGS="-Wno-error"

          test -f out/arch/arm64/boot/Image || { echo "No Image built"; exit 1; }

      - name: Verify built kernel image
        run: |
          cd kernel
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Pack AnyKernel3 flashable zip
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/dtb 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img 2>/dev/null || true
          cp build-assets/scripts/anykernel.sh AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../FindX2Pro-Droidspaces-KSU-kernel.zip . -x '*.git*' README.md
          cd ..
          ls -lh FindX2Pro-Droidspaces-KSU-kernel.zip

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: FindX2Pro-Droidspaces-KSU-kernel
          path: FindX2Pro-Droidspaces-KSU-kernel.zip
          if-no-files-found: error
